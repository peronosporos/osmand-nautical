name: Nautical Unit Tests

on:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code with Submodules
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        path: android # Places your code in a folder named 'android'

    - name: Checkout OsmAnd Resources
      uses: actions/checkout@v4
      with:
        repository: osmandapp/OsmAnd-resources
        path: resources # Places the icons right next to it, where Gradle expects them

    - name: Set up Java Development Kit
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Grant Execute Permission for Gradle
      working-directory: ./android
      run: chmod +x gradlew

    - name: Run Nautical and OsmAnd-shared unit tests
      working-directory: ./android
      env:
        _JAVA_OPTIONS: "-Xmx4g"
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2"
      run: ./gradlew :OsmAnd-shared:jvmTest :OsmAnd:testAndroidFullLegacyArm64DebugUnitTest --no-daemon
