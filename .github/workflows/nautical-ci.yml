name: Build & Test

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: OsmAnd-shared JVM tests (AIS math, KMP common tests)
        run: ./gradlew :OsmAnd-shared:jvmTest --no-daemon

      - name: OsmAnd unit tests (Nautical plugin tests)
        run: ./gradlew :OsmAnd:testAndroidFullLegacyDebugUnitTest --no-daemon

      - name: Compile the OsmAnd app (checks the Nautical plugin Kotlin sources)
        run: ./gradlew :OsmAnd:assembleAndroidFullLegacyDebug --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            OsmAnd/build/reports/tests/**
            OsmAnd-shared/build/test-results/**
